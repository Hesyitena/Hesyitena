name: stats

on:
  schedule:
    - cron: "0 18 * * *" # 01:00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/numbers-*.svg
          git diff --cached --quiet || (git commit -m "Update numbers" && git push)
